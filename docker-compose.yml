services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel-service:hito3
    container_name: laravel_app
    ports:
      - "8000:8000"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: soporte_local
      DB_USERNAME: root
      DB_PASSWORD: root
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: mysql_local_compose
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: soporte_local
    ports:
      - "3308:3306"
    volumes:
      - mysql_datos_compose:/var/lib/mysql

volumes:
  mysql_datos_compose: